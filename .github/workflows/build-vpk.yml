name: Build Vita VPK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-vpk:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check available Vita packages
        shell: bash
        run: |
          set -eux
          dkp-pacman -Ssq | grep -i vita || true

      - name: Install required Vita packages without updating mirrors
        shell: bash
        run: |
          set -eux
          dkp-pacman -S --needed --noconfirm libvita2d || \
          dkp-pacman -S --needed --noconfirm vita2d || \
          dkp-pacman -S --needed --noconfirm vitasdk

      - name: Configure build environment
        shell: bash
        run: |
          set -eux
          export VITASDK="/opt/devkitpro/vitasdk"
          export PATH="$VITASDK/bin:/opt/devkitpro/tools/bin:$PATH"
          echo "VITASDK=$VITASDK" >> "$GITHUB_ENV"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Build project
        shell: bash
        run: |
          set -eux
          export VITASDK="/opt/devkitpro/vitasdk"
          export PATH="$VITASDK/bin:/opt/devkitpro/tools/bin:$PATH"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Show generated files
        shell: bash
        run: |
          echo "Generated files:"
          find build -type f \( -iname "*.vpk" -o -iname "eboot.bin" \) | sort

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/**/*.vpk
            build/**/eboot.bin
          draft: false
          generate_release_notes: true
