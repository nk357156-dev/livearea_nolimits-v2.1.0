name: Build Vita VPK

on:
  push:
  workflow_dispatch:

jobs:
  build-vpk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devkitPro and Vita toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -qO- https://apt.devkitpro.org/devkitpro-pub.gpg | sudo gpg --dearmor -o /usr/share/keyrings/devkitpro.gpg
          echo 'deb [signed-by=/usr/share/keyrings/devkitpro.gpg] https://apt.devkitpro.org stable main' | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm devkitARM libvita2d

      - name: Configure build environment
        shell: bash
        run: |
          export VITASDK=/opt/devkitpro/vitasdk
          export PATH="$VITASDK/bin:/opt/devkitpro/tools/bin:$PATH"
          echo "VITASDK=$VITASDK" >> $GITHUB_ENV
          echo "$VITASDK/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Build project
        shell: bash
        run: |
          export VITASDK=/opt/devkitpro/vitasdk
          export PATH="$VITASDK/bin:/opt/devkitpro/tools/bin:$PATH"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Find output package
        shell: bash
        run: |
          echo "Searching for generated VPK and eboot files..."
          find build -type f \( -iname "*.vpk" -o -iname "eboot.bin" \) | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps-vita-vpk
          path: |
            build/**/*.vpk
            build/**/eboot.bin
